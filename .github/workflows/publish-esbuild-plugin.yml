name: Publish esbuild-plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-publish-environment
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Require npm 11.5.1 or later for https://docs.npmjs.com/trusted-publishers.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # Disable caching in release workflows (https://docs.zizmor.sh/audits/#cache-poisoning).
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: |
          npm run compile
          npm publish --provenance --access public
        working-directory: ./packages/esbuild-plugin-node
